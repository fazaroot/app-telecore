[package]
name = "telecore-backend"
version = "1.2.0"
edition = "2021"
description = "TeleCore backend — Telegram Bot Control Center (Axum + SQLite)"

[[bin]]
name = "telecore-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
aes-gcm = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
anyhow = "1"

# Hemat RAM saat build di mesin kecil: tanpa debug info di profil dev.
[profile.dev]
debug = 0
