# TeleCore CI — backend (Rust) + frontend (React/Vite) + APK debug (Capacitor)
#
# Catatan:
# - TIDAK memakai android-actions/setup-android: paket itu pernah gagal
#   (mencoba menginstal paket 'tools' yang sudah usang). Runner
#   ubuntu-latest sudah menyediakan Android SDK (ANDROID_HOME).
# - Tidak ada job release APK: belum ada signing config. Lihat docs/SIGNING.md.
# - APK hanya terbangun di sini (CI); tidak ada build Gradle lokal.

name: TeleCore CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.toml') }}

      - name: Cargo test
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Cargo build (release)
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: telecore-server-linux-x86_64
          # Nama binary sesuai [[bin]] di backend/Cargo.toml.
          path: backend/target/release/telecore-backend
          if-no-files-found: error

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        # Script "test" (vitest run) ada di frontend/package.json.
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: telecore-web-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android APK (debug)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies (Capacitor)
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Validate APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK tidak ditemukan: $APK"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -le 1048576 ]; then
            echo "::error::APK terlalu kecil ($SIZE bytes), diduga build rusak"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telecore-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
